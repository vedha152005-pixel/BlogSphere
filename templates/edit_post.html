
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Post - BlogSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="logo">
        BlogSphere
    </div>

    <nav class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('create_post') }}">
            Create Post
        </a>

        <a href="{{ url_for('view_posts') }}">
            View Posts
        </a>

        <a href="{{ url_for('my_posts') }}">
            My Posts
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

</header>


<!-- =========================
     EDIT POST PAGE
========================= -->

<main class="edit-post-page">

    <section class="edit-post-container">

        <div class="edit-post-heading">

            <p class="edit-post-tagline">
                UPDATE YOUR STORY
            </p>

            <h1>
                Edit Post
            </h1>

            <p>
                Make changes to your story and keep your post
                up to date.
            </p>

        </div>


        <!-- =========================
             EDIT FORM
        ========================= -->

        <form method="POST" class="edit-post-form">

            <div class="form-group">

                <label for="title">
                    Post Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ post.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Your Story
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="12"
                    required
                >{{ post.content }}</textarea>

            </div>


            <button
                type="submit"
                class="edit-submit-button"
            >
                Update Post
            </button>

        </form>


        <div class="edit-back-link">

            <a href="{{ url_for('my_posts') }}">
                ← Back to My Posts
            </a>

        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    © 2026 BlogSphere. Share your thoughts.

</footer>

</body>
</html>
